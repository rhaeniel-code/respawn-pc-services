<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login - Respawn PC Services
    </title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body class="auth-page">


    <div class="auth-container">

        <div class="auth-card">


            <div class="auth-header">

                <a
                    href="/index.html"
                    class="logo"
                >
                    RESPAWN<span>/</span>PC SERVICES
                </a>


                <div class="auth-kicker">
                    CUSTOMER PORTAL
                </div>


                <h1>
                    Welcome Back
                </h1>


                <p>
                    Login to manage your PC service
                    appointments.
                </p>

            </div>


            <form
                id="loginForm"
                class="auth-form"
            >


                <div class="form-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div
                    id="loginMessage"
                    class="form-message"
                ></div>


                <button
                    type="submit"
                    id="loginButton"
                    class="primary-button full-width"
                >
                    Login
                </button>

            </form>


            <div class="auth-divider">

                <span>
                    RESPAWN / ACCESS
                </span>

            </div>


            <p class="auth-footer">

                Don't have an account?

                <a href="/register.html">
                    Create an account
                </a>

            </p>


            <p class="auth-footer">

                <a href="/index.html">
                    ← Back to Home
                </a>

            </p>

        </div>

    </div>


    <script
        type="module"
        src="/js/auth.js"
    ></script>


</body>

</html>
